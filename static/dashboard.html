<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
    .card .value.hot { color: #dc3545; }
    .card .unit { font-size: 18px; color: #aaa; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin: 2px; }
    .status-online { background: #d4edda; color: #155724; }
    .status-offline { background: #f8d7da; color: #721c24; }
    .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
    .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-on { background: #28a745; color: white; }
    .btn-on:hover { background: #218838; }
    .btn-off { background: #dc3545; color: white; }
    .btn-off:hover { background: #c82333; }
    .btn-blue { background: #667eea; color: white; }
    .btn-blue:hover { background: #5568d3; }
    input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; width: 120px; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
    tr:hover td { background: #f9f9f9; }
    #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
    #log .error { color: #f66; }
    #log .info { color: #6af; }
    #log .warn { color: #fc4; }
    #alert-banner { display: none; background: #dc3545; color: white; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .chart-wrap { position: relative; height: 300px; }
  </style>
</head>
<body>
<div class="container">
  <h1>IoT Dashboard — REST API</h1>

  <div id="alert-banner"></div>

  <div class="cards">
    <div class="card">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card">
      <div class="label">Status</div>
      <div class="value" style="font-size:22px;">
        <span class="status-badge status-offline" id="status-badge">SENSOR OFFLINE</span>
        <span class="status-badge status-offline" id="ws-badge">WS TERPUTUS</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Grafik Real-time</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="panel">
    <h2>Batas Suhu (Threshold)</h2>
    <div class="controls">
      <input type="number" id="thr-input" step="0.1" value="30">
      <button class="btn btn-blue" onclick="setThreshold()">Simpan Batas</button>
      <span id="thr-current" style="color:#666;">Batas saat ini: --</span>
    </div>
  </div>

  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body"><tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// ==============================
// KONFIGURASI
// ==============================
const HOST     = location.protocol.startsWith('http') ? location.hostname : 'localhost';
const API_BASE = `http://${HOST}:1880/api`;
const WS_URL   = `ws://${HOST}:1880/ws/sensor`;
const API_KEY  = 'iot-kampus-123';     // harus sama dengan env API_KEY di tab Node-RED
const MAX_POINTS = 30;                 // jumlah titik di grafik

// ==============================
// UTILITY
// ==============================
function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

// Semua request REST membawa header X-API-Key
async function api(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY, ...(options.headers || {}) }
  });
  const json = await res.json();
  if (res.status === 401) log('API key ditolak (401)', 'error');
  return json;
}

function setSensorBadge(online) {
  const b = document.getElementById('status-badge');
  b.textContent = online ? 'SENSOR ONLINE' : 'SENSOR OFFLINE';
  b.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}
function setWsBadge(online) {
  const b = document.getElementById('ws-badge');
  b.textContent = online ? 'WS TERHUBUNG' : 'WS TERPUTUS';
  b.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}

// ==============================
// CHART.JS
// ==============================
const chart = new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#e74c3c', backgroundColor: 'rgba(231,76,60,0.15)', tension: 0.3, fill: true, yAxisID: 'y' },
      { label: 'Kelembaban (%)', data: [], borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.1)', tension: 0.3, yAxisID: 'y1' },
      { label: 'Batas suhu', data: [], borderColor: '#f39c12', borderDash: [6, 6], pointRadius: 0, yAxisID: 'y' }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false, animation: false,
    scales: {
      y:  { position: 'left',  title: { display: true, text: '°C' } },
      y1: { position: 'right', title: { display: true, text: '%' }, grid: { drawOnChartArea: false } }
    }
  }
});
let threshold = 30;

function addChartPoint(d) {
  chart.data.labels.push(new Date(d.received || d.timestamp).toLocaleTimeString());
  chart.data.datasets[0].data.push(d.suhu);
  chart.data.datasets[1].data.push(d.kelembaban);
  chart.data.datasets[2].data.push(threshold);
  while (chart.data.labels.length > MAX_POINTS) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(ds => ds.data.shift());
  }
  chart.update();
}
function refreshThresholdLine() {
  chart.data.datasets[2].data = chart.data.datasets[2].data.map(() => threshold);
  chart.update();
}

// ==============================
// RENDER DATA
// ==============================
let historyRows = [];   // urutan lama -> baru

function renderLatest(d) {
  document.getElementById('suhu').textContent = d.suhu;
  document.getElementById('kelembaban').textContent = d.kelembaban;
  document.getElementById('suhu').classList.toggle('hot', d.suhu > threshold);
  setSensorBadge(true);
}
function renderTable() {
  const tbody = document.getElementById('history-body');
  if (historyRows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    return;
  }
  tbody.innerHTML = historyRows.slice(-10).reverse().map(d => `
    <tr><td>${new Date(d.received).toLocaleTimeString()}</td><td>${d.suhu}</td><td>${d.kelembaban}</td></tr>
  `).join('');
}
function showAlert(text) {
  const el = document.getElementById('alert-banner');
  el.textContent = 'PERINGATAN: ' + text;
  el.style.display = 'block';
  log(text, 'warn');
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Peringatan Suhu', { body: text });
  }
  setTimeout(() => { el.style.display = 'none'; }, 10000);
}
function setThresholdUI(v) {
  threshold = v;
  document.getElementById('thr-current').textContent = `Batas saat ini: ${v} °C`;
  document.getElementById('thr-input').value = v;
  refreshThresholdLine();
}

// ==============================
// REST: LOAD AWAL
// ==============================
async function loadInitial() {
  try {
    const t = await api('/threshold');
    if (t.status === 'success') setThresholdUI(t.threshold);

    const h = await api('/history');
    if (h.status === 'success') {
      historyRows = h.data;
      historyRows.slice(-MAX_POINTS).forEach(addChartPoint);
      renderTable();
      if (historyRows.length) renderLatest(historyRows[historyRows.length - 1]);
    }
    log('Data awal dimuat dari REST API');
  } catch (err) {
    log(`Gagal load data awal: ${err.message}`, 'error');
  }
}

// ==============================
// REST: THRESHOLD (PUT) & KONTROL (POST)
// ==============================
async function setThreshold() {
  const v = parseFloat(document.getElementById('thr-input').value);
  try {
    const json = await api('/threshold', { method: 'PUT', body: JSON.stringify({ threshold: v }) });
    if (json.status === 'success') log(`Threshold diubah menjadi ${json.threshold} °C`);
    else log(`Gagal set threshold: ${json.message}`, 'error');
  } catch (err) { log(`Error threshold: ${err.message}`, 'error'); }
}
async function kontrol(device, action) {
  try {
    const json = await api('/kontrol', { method: 'POST', body: JSON.stringify({ device, action }) });
    if (json.status === 'success') log(`Perintah terkirim: ${device} → ${action}`);
    else log(`Gagal: ${json.message}`, 'error');
  } catch (err) { log(`Error kontrol: ${err.message}`, 'error'); }
}

// ==============================
// WEBSOCKET (pengganti polling)
// ==============================
let ws, reconnectTimer;
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { setWsBadge(true); log('WebSocket terhubung (tanpa polling)'); };
  ws.onclose = () => {
    setWsBadge(false);
    setSensorBadge(false);
    log('WebSocket terputus, mencoba lagi 3 detik...', 'error');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'sensor') {
      threshold = m.threshold;
      historyRows.push(m.data);
      if (historyRows.length > 50) historyRows.shift();
      renderLatest(m.data);
      renderTable();
      addChartPoint(m.data);
    } else if (m.type === 'alert') {
      showAlert(m.message);
    } else if (m.type === 'threshold') {
      setThresholdUI(m.threshold);
    }
  };
}

// ==============================
// START
// ==============================
if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
log('Dashboard dimulai');
loadInitial().then(connectWS);
</script>
</body>
</html>
